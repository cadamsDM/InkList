<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE INKLIST - Christchurch Tattoo Studio Directory</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="main-header">
        <div class="container">
            <a href="#" class="logo">ChCh Ink</a>
            <nav class="main-nav">
                <ul>
                    <li><a href="#studios">Studios</a></li>
                    <li><a href="#blog">Blog</a></li>
                    <li><a href="#about">About</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section id="hero">
            <div class="hero-content">
                <h1>Find Your Perfect Tattoo in Christchurch</h1>
                <p>A comprehensive guide to the city's talented artists and unique studios.</p>
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="Search for a studio or artist...">
                </div>
            </div>
        </section>

        <section id="studios" class="container">
            <h2>Explore Studios</h2>
            
            <div class="controls">
                <div class="filters">
                    <h3>Filter by Style:</h3>
                    <div class="filter-group" id="style-filters">
                        <!-- Checkboxes will be generated by JS -->
                    </div>
                    <h3>Filter by Price:</h3>
                    <div class="filter-group" id="price-filters">
                         <!-- Checkboxes will be generated by JS -->
                    </div>
                </div>
                <button id="clear-filters">Clear All Filters</button>
            </div>

            <div id="studio-gallery" class="gallery-grid">
                <!-- Studio cards will be dynamically inserted here by JS -->
            </div>
        </section>

        <section id="blog" class="container">
            <h2>From the Blog</h2>
            <div class="blog-grid">
                <!-- Blog posts will be dynamically inserted here by JS -->
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2024 ChCh Ink. All Rights Reserved.</p>
            <p>Made with ❤️ in Christchurch.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
